# Job 2: Plan (runs on PRs only, needs Snowflake connection)
terraform-plan:
  name: Plan Terraform Changes
  runs-on: ubuntu-latest
  needs: terraform-validate
  if: github.event_name == 'pull_request'

  env:
    TF_VAR_snowflake_account: ${{ secrets.SNOWFLAKE_ACCOUNT }}
    TF_VAR_snowflake_user: ${{ secrets.SNOWFLAKE_USER }}
    TF_VAR_snowflake_password: ${{ secrets.SNOWFLAKE_PASSWORD }}
    TF_VAR_snowflake_role: ${{ secrets.SNOWFLAKE_ROLE }}
    TF_VAR_snowflake_warehouse: ${{ secrets.SNOWFLAKE_WAREHOUSE }}
    TF_VAR_database_name: ${{ secrets.SNOWFLAKE_DATABASE }}
    TF_VAR_schema_name: ${{ secrets.SNOWFLAKE_SCHEMA }}

  steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Terraform
      uses: hashicorp/setup-terraform@v2
      with:
        terraform_version: ${{ env.TF_VERSION }}

    - name: Terraform Init
      run: terraform init
      working-directory: ${{ env.TERRAFORM_DIR }}

    - name: Terraform Plan
      id: plan
      run: terraform plan -no-color 2>&1 | tee plan_output.txt
      working-directory: ${{ env.TERRAFORM_DIR }}
      continue-on-error: true

    - name: Comment Plan on PR
      uses: actions/github-script@v7
      with:
        github-token: ${{ secrets.GITHUB_TOKEN }}
        script: |
          const fs = require('fs');
          const plan = fs.readFileSync(`${{ env.TERRAFORM_DIR }}/plan_output.txt`, 'utf8');
          const outcome = '${{ steps.plan.outcome }}';
          const icon = outcome === 'success' ? '✅' : '❌';
          const body = [
            `## ${icon} Terraform Plan`,
            '',
            '<details><summary>Show Plan Output</summary>',
            '',
            '```',
            plan.substring(0, 65000),
            '```',
            '</details>'
          ].join('\n');

          github.rest.issues.createComment({
            issue_number: context.issue.number,
            owner: context.repo.owner,
            repo: context.repo.repo,
            body: body
          });

    - name: Fail if plan failed
      if: steps.plan.outcome == 'failure'
      run: exit 1

# Job 3: Apply (runs on push to main only, after validation)
terraform-apply:
  name: Apply Terraform Changes
  runs-on: ubuntu-latest
  needs: terraform-validate
  if: github.ref == 'refs/heads/main' && github.event_name == 'push'
  environment: production

  env:
    TF_VAR_snowflake_account: ${{ secrets.SNOWFLAKE_ACCOUNT }}
    TF_VAR_snowflake_user: ${{ secrets.SNOWFLAKE_USER }}
    TF_VAR_snowflake_password: ${{ secrets.SNOWFLAKE_PASSWORD }}
    TF_VAR_snowflake_role: ${{ secrets.SNOWFLAKE_ROLE }}
    TF_VAR_snowflake_warehouse: ${{ secrets.SNOWFLAKE_WAREHOUSE }}
    TF_VAR_database_name: ${{ secrets.SNOWFLAKE_DATABASE }}
    TF_VAR_schema_name: ${{ secrets.SNOWFLAKE_SCHEMA }}

  steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Terraform
      uses: hashicorp/setup-terraform@v2
      with:
        terraform_version: ${{ env.TF_VERSION }}

    - name: Terraform Init
      run: terraform init
      working-directory: ${{ env.TERRAFORM_DIR }}

    - name: Terraform Apply
      run: terraform apply -auto-approve -no-color
      working-directory: ${{ env.TERRAFORM_DIR }}

    - name: Terraform Output
      run: terraform output -no-color
      working-directory: ${{ env.TERRAFORM_DIR }}

